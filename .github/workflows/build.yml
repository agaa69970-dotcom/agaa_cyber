name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash "$(ls cyber_setup*.sh | sort -V | tail -1)"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create . --platforms=android --project-name agaa_cyber --org com.agaa
      - run: bash "$(ls cyber_setup*.sh | sort -V | tail -1)"
      - name: compress native libs
        run: |
          f=android/app/build.gradle.kts
          if [ -f "$f" ]; then
            printf '\nandroid {\n    packaging {\n        jniLibs {\n            useLegacyPackaging = true\n        }\n    }\n}\n' >> "$f"
          fi
      - run: flutter pub get
      - name: analyze
        continue-on-error: true
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings > analyze.txt 2>&1
          echo "analyze exit=$?" >> analyze.txt
      - name: build
        id: build
        continue-on-error: true
        run: |
          flutter build apk --release --split-per-abi > build.txt 2>&1
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk AgaaCyber.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk AgaaCyber_32bit.apk
      - name: notes
        if: always()
        run: |
          echo "build: ${{ steps.build.outcome }}" > notes.txt
          if [ "${{ steps.build.outcome }}" = "success" ]; then
            unzip -tq AgaaCyber.apk >> notes.txt 2>&1
            ls -l *.apk | awk '{print $5, $9}' >> notes.txt
            sha256sum *.apk >> notes.txt
          else
            echo "---- build log (tail) ----" >> notes.txt
            tail -n 60 build.txt >> notes.txt
          fi
          echo "---- analyze (errors/warnings) ----" >> notes.txt
          grep -E "error|warning" analyze.txt | head -60 >> notes.txt || true
          tail -n 2 analyze.txt >> notes.txt
          head -c 60000 notes.txt > notes2.txt
      - uses: softprops/action-gh-release@v2
        if: always()
        with:
          tag_name: v${{ github.run_number }}
          files: |
            AgaaCyber.apk
            AgaaCyber_32bit.apk
            notes2.txt
